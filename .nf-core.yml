  # Every schema default is declared in main.nf rather than nextflow.config, so the schema/config
  # comparison has nothing to compare.
  schema_params: false
  # Tests pass no `outdir` because the pipeline publishes with `-output-dir`.
  nf_test_content:
    - tests/default.nf.test
    - tests/test_affy.nf.test
    - tests/test_many.nf.test
    - tests/test_maxquant.nf.test
    - tests/test_nogtf.nf.test
    - tests/test_rnaseq_deseq2.nf.test
    - tests/test_rnaseq_dream.nf.test
    - tests/test_rnaseq_limma.nf.test
    - tests/test_rnaseq_propd_grea.nf.test
    - tests/test_soft.nf.test
nf_core_version: 4.0.2
repository_type: pipeline
template:
  author: Oskar Wacker, Jonathan Manning
  description: Differential abundance analysis
  force: false
  is_nfcore: true
  name: differentialabundance
  org: nf-core
  outdir: .
  skip_features:
    - fastqc
    - multiqc
  version: 2.0.0

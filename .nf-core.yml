lint:
  files_exist:
    - assets/multiqc_config.yml
  files_unchanged:
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/nf-core-differentialabundance_logo_light.png
    - docs/images/nf-core-differentialabundance_logo_light.png
    - docs/images/nf-core-differentialabundance_logo_dark.png
  multiqc_config: false
  # Pipeline parameters and their defaults are declared in the typed `params {}` block of main.nf,
  # which `nextflow config` (used by the lint) does not see. Each parameter is ignored individually.
  nextflow_config:
    - params.outdir
    - params.input
    - config_defaults:
        - params.logo_file
        - params.css_file
        - params.citations_file
        - params.report_file
        - params.paramsheet
        - params.affy_background
        - params.affy_bgversion
        - params.affy_build_annotation
        - params.affy_destructive
        - params.affy_file_name_col
        - params.affy_rm_extra
        - params.affy_rm_mask
        - params.affy_rm_outliers
        - params.decoupler_methods
        - params.decoupler_min_n
        - params.deseq2_alpha
        - params.deseq2_alt_hypothesis
        - params.deseq2_fit_type
        - params.deseq2_independent_filtering
        - params.deseq2_lfc_threshold
        - params.deseq2_min_replicates_for_replace
        - params.deseq2_minmu
        - params.deseq2_p_adjust_method
        - params.deseq2_sf_type
        - params.deseq2_shrink_lfc
        - params.deseq2_test
        - params.deseq2_use_t
        - params.deseq2_vs_blind
        - params.deseq2_vs_method
        - params.deseq2_vst_nsub
        - params.differential_feature_id_column
        - params.differential_max_pval
        - params.differential_max_qval
        - params.differential_method
        - params.differential_min_fold_change
        - params.differential_palette_name
        - params.differential_subset_to_contrast_samples
        - params.dream_adjust_method
        - params.dream_apply_voom
        - params.dream_confint
        - params.dream_ddf
        - params.dream_lfc
        - params.dream_p_value
        - params.dream_proportion
        - params.dream_reml
        - params.dream_robust
        - params.dream_stdev_coef_lim
        - params.dream_trend
        - params.dream_winsor_tail_p
        - params.exploratory_assay_names
        - params.exploratory_clustering_method
        - params.exploratory_cor_method
        - params.exploratory_final_assay
        - params.exploratory_log2_assays
        - params.exploratory_mad_threshold
        - params.exploratory_main_variable
        - params.exploratory_n_features

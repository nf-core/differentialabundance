        - params.gprofiler2_domain_scope
        - params.gprofiler2_evcodes
        - params.gprofiler2_max_qval
        - params.gprofiler2_measure_underrepresentation
        - params.gprofiler2_min_diff
        - params.gprofiler2_palette_name
        - params.gprofiler2_significant
        - params.grea_permutation
        - params.grea_set_max
        - params.grea_set_min
        - params.gsea_make_sets
        - params.gsea_median
        - params.gsea_metric
        - params.gsea_norm
        - params.gsea_nperm
        - params.gsea_num
